[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caritas-pets-backend"
version = "1.0.0"
description = "Backend em Python para a plataforma Carita's Pets"
authors = [{ name = "Engenharia Caritas Pets" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pycryptodome>=3.20.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.vercel.fastapi.static]
cdn = false


